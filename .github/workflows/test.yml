name: tests

# Two decisions worth keeping: a documentation-only push proves nothing about the
# code, so it does not run the suite; and a superseded run is cancelled instead of
# paying for both (minutes are free on a public repo, but a stale red/green check
# is still noise). A commit that touches both docs and code does run.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung test must not burn the whole quota.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
